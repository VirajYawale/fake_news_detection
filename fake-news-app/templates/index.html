<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake News Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📰 Fake News Detection</h1>
        <form method="POST">
            <textarea name="news_text" placeholder="Paste your news headline or article here..." required></textarea>
            <button type="submit">Detect</button>
        </form>
        {% if prediction %}
        <div class="result {{ label }}">
            <h2>{{ prediction }}</h2>
        </div>
        {% endif %}
    </div>
</body>
</html>
